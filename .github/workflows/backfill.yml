name: docker build backfill

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    name: Build docker image
    strategy:
      matrix:
        include:
          - tag: 1784910972-v0.16.4-5791b4e
            version: 0.16.4
          - tag: 1784639236-v0.16.3-e29ac6c
            version: 0.16.3
          - tag: 1783848739-v0.16.2-13e0052
            version: 0.16.2
          - tag: 1783780333-v0.16.1-c6f39d5
            version: 0.16.1
          - tag: 1783767804-v0.16.0-8938bcb
            version: 0.16.0
          - tag: 1782409627-v0.15.9-b572fb9
            version: 0.15.9
          - tag: 1779556048-v0.15.8-1a7a078
            version: 0.15.8
          - tag: 1779551709-v0.15.7-5dab3d8
            version: 0.15.7
          - tag: 1778608617-v0.15.6-28815da
            version: 0.15.6
          - tag: 1772125974-v0.15.5-be7ff6b
            version: 0.15.5
          - tag: 1771249043-v0.15.4-2ac19a3
            version: 0.15.4
    steps:
      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker
        uses: docker/build-push-action@v7
        with:
          load: true
          build-args: |
            TAG=${{ matrix.tag }}
            VERSION=${{ matrix.version }}
          tags: ghcr.io/lucasheld/telerising-api:test

      - name: Run
        run: |
          docker run --rm -it -d -p 5000:5000 --name telerising-api ghcr.io/lucasheld/telerising-api:test

      - name: Test
        uses: nick-fields/retry@v4
        with:
          timeout_seconds: 1
          max_attempts: 10
          command: curl http://127.0.0.1:5000/

      - name: Stop
        run: |
          docker stop telerising-api

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          build-args: |
            TAG=${{ matrix.tag }}
            VERSION=${{ matrix.version }}
          tags: |
            ghcr.io/lucasheld/telerising-api:${{ matrix.version }}
